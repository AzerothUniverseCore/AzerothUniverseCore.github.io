<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="site-title" href="{{ '/' | relative_url }}">
        <img class="site-logo" src="{{ '/assets/images/logo.png' | relative_url }}" alt="Azeroth Universe">
        Azeroth Universe
      </a>
      <nav class="header-nav">
        <a href="https://discord.gg/HJ6pDKjysa">Discord</a>
        <a href="https://github.com/AzerothUniverseCore/UniverseEmu">GitHub</a>
      </nav>
    </div>
  </header>

  <main class="content">
    <div class="content-panel">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <p>Azeroth Universe &middot; <a href="https://discord.gg/HJ6pDKjysa">Discord</a> &middot; <a href="https://github.com/AzerothUniverseCore/UniverseEmu">GitHub</a></p>
  </footer>

</body>
</html>
